name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel --target Thinamp_VST3 EngineTests UiSnapshot

      - name: Engine tests
        run: build/EngineTests_artefacts/Release/EngineTests.exe

      - name: UI snapshot
        run: build/UiSnapshot_artefacts/Release/UiSnapshot.exe ui-windows.png 3 64

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory stage, dist | Out-Null
          Copy-Item -Recurse build/Thinamp_artefacts/Release/VST3/Thinamp.vst3 stage/
          Copy-Item install.ps1, "scripts/windows/Install Thinamp.cmd" stage/
          Compress-Archive -Path stage/* -DestinationPath dist/Thinamp-windows.zip

      # The runner is admin, so this covers the offline path minus the UAC prompt.
      - name: Test installer
        shell: powershell
        run: |
          Expand-Archive dist/Thinamp-windows.zip unzipped
          ./unzipped/install.ps1
          $dll = Join-Path $env:CommonProgramFiles 'VST3/Thinamp.vst3/Contents/x86_64-win/Thinamp.vst3'
          if (-not (Test-Path $dll)) { throw "Not installed: $dll" }

      - uses: actions/upload-artifact@v4
        with:
          name: Thinamp-windows
          path: dist/Thinamp-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ui-snapshot-windows
          path: ui-windows.png

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/Thinamp-windows.zip --clobber
